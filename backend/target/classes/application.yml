server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/project_management
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIGRlZmF1bHQgZGV2IHNlY3JldCBrZXkgdGhhdCBpcyBsb25nIGVub3VnaCBmb3IgSE1BQy1TSEEyNTY=}
    access-expiration: 900000
    refresh-expiration: 604800000
